<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Health Nursing Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>📝 Community Health Nursing</h1>

<p>Chapter 1 Quiz</p>

</header>

<section class="years">

<div class="card">

<div class="timer">
⏳ <span id="timer">05:00</span>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<button id="nextBtn">
▶️ التالي
</button>

</div>

</section>

<script>

const questions=[

{

question:"Community Health Nursing focuses mainly on:",

answers:[

{text:"The whole community",correct:true},

{text:"Only hospital patients",correct:false},

{text:"Doctors only",correct:false},

{text:"Medical laboratories",correct:false}

]

},

{

question:"According to WHO, health includes:",

answers:[

{text:"Physical, mental and social well-being",correct:true},

{text:"Only absence of disease",correct:false},

{text:"Physical health only",correct:false},

{text:"Mental health only",correct:false}

]

},

{

question:"Which organization defined Community Health Nursing?",

answers:[

{text:"American Nursing Association (ANA)",correct:true},

{text:"UNICEF",correct:false},

{text:"WHO",correct:false},

{text:"Red Crescent",correct:false}

]

},

{

question:"Primary prevention aims to:",

answers:[

{text:"Prevent disease before it occurs",correct:true},

{text:"Treat disease",correct:false},

{text:"Reduce disability",correct:false},

{text:"Rehabilitation",correct:false}

]

},

{

question:"One determinant of health is:",

answers:[

{text:"Education",correct:true},

{text:"Hair color",correct:false},

{text:"Eye color",correct:false},

{text:"Favorite food",correct:false}

]

}

];

let currentQuestion=0;
let score=0;

let timeLeft=300;

const timer=document.getElementById("timer");

const countdown=setInterval(function(){

if(timeLeft<=0){

clearInterval(countdown);

showResult();

return;

}

timeLeft--;

let minutes=Math.floor(timeLeft/60);

let seconds=timeLeft%60;

timer.innerHTML=

String(minutes).padStart(2,"0")

+":"

+

String(seconds).padStart(2,"0");

},1000);

let score=0;

const questionElement=document.getElementById("question");

const answersElement=document.getElementById("answers");

const nextButton=document.getElementById("nextBtn");

function showQuestion(){

resetState();

let q=questions[currentQuestion];

questionElement.innerHTML=(currentQuestion+1)+". "+q.question;

q.answers.forEach(answer=>{

const button=document.createElement("button");

button.innerHTML=answer.text;

button.onclick=()=>selectAnswer(answer.correct,button);

answersElement.appendChild(button);

});

}

function resetState(){

nextButton.style.display="none";

answersElement.innerHTML="";

}

function selectAnswer(correct,button){

if(correct){

score++;

button.style.background="green";

}else{

button.style.background="red";

}

Array.from(answersElement.children).forEach(btn=>btn.disabled=true);

nextButton.style.display="block";

}

nextButton.onclick=function(){

currentQuestion++;

if(currentQuestion<questions.length){

showQuestion();

}else{

questionElement.innerHTML="🎉 Your Score: "+score+" / "+questions.length;

answersElement.innerHTML="";

nextButton.style.display="none";

}

}

showQuestion();

</script>

</body>

</html>
