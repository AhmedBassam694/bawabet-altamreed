<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>General Surgery - Chapter 3 Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>📝 General Surgery</h1>

<p>Chapter 3 Quiz</p>

</header>

<section class="years">

<div class="card">

<div class="timer">
⏳ <span id="timer">05:00</span>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<button id="nextBtn">
▶️ التالي
</button>

</div>

</section>

<script>

const questions=[

{
question:"Shock is:",
answers:[
{text:"A drop in blood circulation",correct:true},
{text:"An increase in blood pressure",correct:false},
{text:"A lung disease",correct:false},
{text:"A bone disease",correct:false}
]
},

{
question:"Which type of shock is caused by severe blood loss?",
answers:[
{text:"Surgical Shock",correct:true},
{text:"Neurogenic Shock",correct:false},
{text:"Septic Shock",correct:false},
{text:"Cardiogenic Shock",correct:false}
]
},

{
question:"Which stage of shock responds to treatment?",
answers:[
{text:"Reversible Shock",correct:true},
{text:"Irreversible Shock",correct:false},
{text:"Terminal Shock",correct:false},
{text:"Septic Shock",correct:false}
]
},

{
question:"A common symptom of Surgical Shock is:",
answers:[
{text:"Rapid weak pulse",correct:true},
{text:"High blood pressure",correct:false},
{text:"Slow breathing",correct:false},
{text:"Bradycardia",correct:false}
]
},

{
question:"Neurogenic Shock is mainly caused by:",
answers:[
{text:"Severe pain",correct:true},
{text:"Infection",correct:false},
{text:"Bleeding",correct:false},
{text:"Burns",correct:false}
]
},

{
question:"Which type of shock is caused by severe infection?",
answers:[
{text:"Septic Shock",correct:true},
{text:"Surgical Shock",correct:false},
{text:"Neurogenic Shock",correct:false},
{text:"Hypovolemic Shock",correct:false}
]
},

{
question:"One treatment for Septic Shock is:",
answers:[
{text:"Strong antibiotics",correct:true},
{text:"Vitamin C only",correct:false},
{text:"Calcium tablets",correct:false},
{text:"Bed rest only",correct:false}
]
},

{
question:"Which IV fluid may be used in Surgical Shock?",
answers:[
{text:"Ringer's Solution",correct:true},
{text:"Distilled Water",correct:false},
{text:"Fruit Juice",correct:false},
{text:"Milk",correct:false}
]
},

{
question:"Low blood pressure is a symptom of:",
answers:[
{text:"Shock",correct:true},
{text:"Common Cold",correct:false},
{text:"Hypertension",correct:false},
{text:"Asthma",correct:false}
]
},

{
question:"The first step in managing shock is:",
answers:[
{text:"Treat the cause",correct:true},
{text:"Give antibiotics to everyone",correct:false},
{text:"Allow the patient to walk",correct:false},
{text:"Delay treatment",correct:false}
]
}

];

let currentQuestion=0;
let score=0;
let timeLeft=300;

const timer=document.getElementById("timer");
const questionElement=document.getElementById("question");
const answersElement=document.getElementById("answers");
const nextButton=document.getElementById("nextBtn");

const countdown=setInterval(function(){

if(timeLeft<=0){

showResult();
return;

}

timeLeft--;

let minutes=Math.floor(timeLeft/60);
let seconds=timeLeft%60;

timer.innerHTML=
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

},1000);

function showQuestion(){

resetState();

document.getElementById("progressBar").style.width=((currentQuestion+1)/questions.length)*100+"%";

let q=questions[currentQuestion];

questionElement.innerHTML=(currentQuestion+1)+". "+q.question;

q.answers.forEach(answer=>{

const button=document.createElement("button");

button.innerHTML=answer.text;

button.onclick=()=>selectAnswer(answer.correct,button);

answersElement.appendChild(button);

});

}

function resetState(){

nextButton.style.display="none";
answersElement.innerHTML="";

}

function selectAnswer(correct,button){

if(correct){

score++;
button.style.background="green";

}else{

button.style.background="red";

}

Array.from(answersElement.children).forEach(btn=>btn.disabled=true);

nextButton.style.display="block";

}

nextButton.onclick=function(){

currentQuestion++;

if(currentQuestion<questions.length){

showQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(countdown);

let percentage=Math.round((score/questions.length)*100);

let message="";

if(percentage>=90){

message="🏆 Excellent! Outstanding performance.";

}else if(percentage>=75){

message="👏 Very Good! Keep it up.";

}else if(percentage>=50){

message="👍 Good. Review the chapter and try again.";

}else{

message="📚 You need more revision. Read the chapter again.";

}

document.querySelector(".card").innerHTML=`

<div class="result-box">

<h2>🎉 Quiz Finished</h2>

<p>Your Score</p>

<h1>${score} / ${questions.length}</h1>

<h2>${percentage}%</h2>

<p>${message}</p>

<button onclick="location.reload()">🔄 Retry Quiz</button>

<br><br>

<button onclick="history.back()">🏠 Back to Chapter</button>

</div>

`;

}

showQuestion();

</script>

</body>
</html>
