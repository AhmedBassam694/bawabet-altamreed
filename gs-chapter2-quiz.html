<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>General Surgery - Chapter 2 Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>📝 General Surgery</h1>

<p>Chapter 2 Quiz</p>

</header>

<section class="years">

<div class="card">

<div class="timer">
⏳ <span id="timer">05:00</span>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<button id="nextBtn">
▶️ التالي
</button>

</div>

</section>

<script>

const questions=[

{
question:"Water constitutes about ____ of body weight.",
answers:[
{text:"60%",correct:true},
{text:"40%",correct:false},
{text:"25%",correct:false},
{text:"80%",correct:false}
]
},

{
question:"The largest amount of body water is found in:",
answers:[
{text:"Intracellular fluid",correct:true},
{text:"Plasma",correct:false},
{text:"Interstitial fluid",correct:false},
{text:"Blood vessels",correct:false}
]
},

{
question:"The normal potassium level is:",
answers:[
{text:"3.5 - 5.0 mEq/L",correct:true},
{text:"1 - 2 mEq/L",correct:false},
{text:"6 - 8 mEq/L",correct:false},
{text:"8 - 10 mEq/L",correct:false}
]
},

{
question:"A common cause of dehydration is:",
answers:[
{text:"Severe diarrhea",correct:true},
{text:"Sleeping",correct:false},
{text:"Walking",correct:false},
{text:"Reading",correct:false}
]
},

{
question:"One symptom of dehydration is:",
answers:[
{text:"Dry mouth",correct:true},
{text:"Hair loss",correct:false},
{text:"Blurred vision",correct:false},
{text:"Ear pain",correct:false}
]
},

{
question:"Low potassium may cause:",
answers:[
{text:"Muscle weakness",correct:true},
{text:"High fever",correct:false},
{text:"Skin rash",correct:false},
{text:"Hearing loss",correct:false}
]
},

{
question:"Rapid IV potassium may lead to:",
answers:[
{text:"Cardiac arrest",correct:true},
{text:"Improved vision",correct:false},
{text:"Weight gain",correct:false},
{text:"High appetite",correct:false}
]
},

{
question:"Calcium Gluconate should be given:",
answers:[
{text:"Slowly IV",correct:true},
{text:"Rapid IV push",correct:false},
{text:"Only orally",correct:false},
{text:"By inhalation",correct:false}
]
},

{
question:"One cause of sodium deficiency is:",
answers:[
{text:"Diarrhea",correct:true},
{text:"Exercise",correct:false},
{text:"Reading books",correct:false},
{text:"Hair cutting",correct:false}
]
},

{
question:"Rapid correction of sodium deficiency may cause:",
answers:[
{text:"Brain damage",correct:true},
{text:"Better memory",correct:false},
{text:"Improved appetite",correct:false},
{text:"High blood sugar",correct:false}
]
}

];

let currentQuestion=0;
let score=0;

let timeLeft=300;

const timer=document.getElementById("timer");

const questionElement=document.getElementById("question");
const answersElement=document.getElementById("answers");
const nextButton=document.getElementById("nextBtn");

const countdown=setInterval(function(){

if(timeLeft<=0){

showResult();

return;

}

timeLeft--;

let minutes=Math.floor(timeLeft/60);
let seconds=timeLeft%60;

timer.innerHTML=
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

},1000);

function showQuestion(){

resetState();

document.getElementById("progressBar").style.width=((currentQuestion+1)/questions.length)*100+"%";

let q=questions[currentQuestion];

questionElement.innerHTML=(currentQuestion+1)+". "+q.question;

q.answers.forEach(answer=>{

const button=document.createElement("button");

button.innerHTML=answer.text;

button.onclick=()=>selectAnswer(answer.correct,button);

answersElement.appendChild(button);

});

}

function resetState(){

nextButton.style.display="none";
answersElement.innerHTML="";

}

function selectAnswer(correct,button){

if(correct){

score++;
button.style.background="green";

}else{

button.style.background="red";

}

Array.from(answersElement.children).forEach(btn=>btn.disabled=true);

nextButton.style.display="block";

}

nextButton.onclick=function(){

currentQuestion++;

if(currentQuestion<questions.length){

showQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(countdown);

let percentage=Math.round((score/questions.length)*100);

let message="";

if(percentage>=90){

message="🏆 Excellent! Outstanding performance.";

}else if(percentage>=75){

message="👏 Very Good! Keep it up.";

}else if(percentage>=50){

message="👍 Good. Review the chapter and try again.";

}else{

message="📚 You need more revision. Read the chapter again.";

}

document.querySelector(".card").innerHTML=`

<div class="result-box">

<h2>🎉 Quiz Finished</h2>

<p>Your Score</p>

<h1>${score} / ${questions.length}</h1>

<h2>${percentage}%</h2>

<p>${message}</p>

<button onclick="location.reload()">🔄 Retry Quiz</button>

<br><br>

<button onclick="history.back()">🏠 Back to Chapter</button>

</div>

`;

}

showQuestion();

</script>

</body>

</html>
