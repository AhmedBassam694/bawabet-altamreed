<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الأدمن | بوابة التمريض</title>

<style>

body{
    font-family: Arial;
    background:#f2f6fa;
    padding:20px;
}


.container{

    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;

}


input,button{

    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;

}


button{

    background:#0066cc;
    color:white;
    cursor:pointer;

}


table{

    width:100%;
    border-collapse:collapse;
    margin-top:20px;

}


th,td{

    border:1px solid #ddd;
    padding:10px;
    text-align:center;

}


h1{

    color:#0066cc;

}


</style>

</head>


<body>


<div class="container">


<h1>🩺 لوحة إدارة بوابة التمريض</h1>


<h2>إضافة كود اشتراك</h2>


<input id="code" placeholder="كود الاشتراك">


<input id="password" placeholder="كلمة المرور">


<input id="days" type="number" placeholder="مدة الاشتراك بالأيام">



<button onclick="addCode()">

إضافة الكود

</button>



<h2>الأكواد الموجودة</h2>


<table>


<thead>

<tr>

<th>الكود</th>

<th>الحالة</th>

<th>تاريخ الانتهاء</th>

</tr>


</thead>


<tbody id="codesTable">


</tbody>


</table>


</div>





<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- ملف إعدادات Firebase -->

<script src="firebase.js"></script>




<script>



function addCode(){



let code = document.getElementById("code").value.trim();

let password = document.getElementById("password").value.trim();

let days = Number(document.getElementById("days").value);




if(code === "" || password === "" || !days){


alert("من فضلك أكمل البيانات");

return;


}




let expire = new Date();


expire.setDate(expire.getDate() + days);





db.collection("students").doc(code).set({


code: code,


password: password,


active:true,


expiresAt:expire.toISOString(),


deviceId:"null",


name:"",


grade:""



})

.then(function(){


alert("✅ تم إنشاء كود الاشتراك");


document.getElementById("code").value="";

document.getElementById("password").value="";

document.getElementById("days").value="";


loadCodes();


})


.catch(function(error){


console.log(error);

alert(error.message);


});



}





function loadCodes(){



let table = document.getElementById("codesTable");


table.innerHTML="";




db.collection("students").get()



.then(function(snapshot){



snapshot.forEach(function(doc){



let data = doc.data();




table.innerHTML += `


<tr>

<td>${data.code}</td>

<td>${data.active ? "فعال ✅" : "متوقف ❌"}</td>

<td>${new Date(data.expiresAt).toLocaleDateString("ar-EG")}</td>

</tr>


`;



});



})

.catch(function(error){


console.log(error);

alert(error.message);


});



}




loadCodes();



</script>


</body>

</html>
