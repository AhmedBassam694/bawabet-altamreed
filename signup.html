<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب | بوابة التمريض</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<h2>🩺 إنشاء حساب</h2>

<input
type="text"
id="name"
placeholder="الاسم بالكامل">

<br><br>

<select id="grade">

<option value="">اختر الصف الدراسي</option>

<option value="الصف الأول الثانوي التمريض">
الصف الأول الثانوي التمريض
</option>

<option value="الصف الثاني الثانوي التمريض">
الصف الثاني الثانوي التمريض
</option>

</select>

<br><br>

<input
type="email"
id="email"
placeholder="البريد الإلكتروني">

<br><br>

<input
type="password"
id="password"
placeholder="كلمة المرور">

<br><br>

<button onclick="signUp()">
إنشاء حساب
</button>

<br><br>

<p>
لديك حساب؟
<a href="login.html">تسجيل الدخول</a>
</p>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script>

function signUp(){

const name = document.getElementById("name").value.trim();
const grade = document.getElementById("grade").value;
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

if(name === "" || grade === "" || email === "" || password === ""){

alert("من فضلك أكمل جميع البيانات");
return;

}

auth.createUserWithEmailAndPassword(email, password)

.then((userCredential)=>{

const user = userCredential.user;

return db.collection("users").doc(user.uid).set({

name: name,
email: email,
grade: grade,
createdAt: firebase.firestore.FieldValue.serverTimestamp()

});

})

.then(()=>{

alert("✅ تم إنشاء الحساب بنجاح");

window.location.href = "login.html";

})

.catch((error)=>{

if(error.code === "auth/email-already-in-use"){

alert("❌ هذا البريد الإلكتروني مستخدم بالفعل");

}

else if(error.code === "auth/weak-password"){

alert("❌ كلمة المرور يجب أن تكون 6 أحرف أو أكثر");

}

else if(error.code === "auth/invalid-email"){

alert("❌ البريد الإلكتروني غير صحيح");

}

else{

alert("❌ " + error.code);

console.log(error);

}

});

}

</script>

</body>

</html>
