<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | بوابة التمريض</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<div class="logo">🩺</div>

<h2>بوابة التمريض</h2>

<p>سجل الدخول للمتابعة</p>

<div class="input-box">
<span class="icon">🔑</span>
<input type="text" id="code" placeholder="كود الاشتراك">
</div>

<div class="input-box">
<span class="icon">🔒</span>
<input type="password" id="password" placeholder="كلمة المرور">
</div>

<button onclick="login()">
تسجيل الدخول
</button>

<br><br>

<p>
إذا لم يكن لديك كود اشتراك، تواصل مع إدارة بوابة التمريض.
</p>

<div class="footer">
© 2026 بوابة التمريض
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script>

function login(){

const code = document.getElementById("code").value.trim();
const password = document.getElementById("password").value.trim();

if(code==="" || password===""){
alert("من فضلك أدخل كود الاشتراك وكلمة المرور");
return;
}

db.collection("students").doc(code).get()

.then(function(doc){

if(!doc.exists){
alert("❌ كود الاشتراك غير صحيح");
return;
}

const student = doc.data();

// معرف الجهاز

let deviceId = localStorage.getItem("deviceId");

if(!deviceId){

deviceId = Date.now().toString();

localStorage.setItem("deviceId", deviceId);

}
  
if(student.password !== password){
alert("❌ كلمة المرور غير صحيحة");
return;
}

if(student.active !== true){
alert("❌ هذا الاشتراك غير مفعل");
return;
}

// أول تسجيل دخول

if(student.deviceId === "null"){

db.collection("students").doc(code).update({

deviceId: deviceId

})

.then(function(){

alert("✅ تم حفظ الجهاز");

localStorage.setItem("studentCode",code);
localStorage.setItem("studentName",student.name);
localStorage.setItem("studentGrade",student.grade);

window.location.href="index.html";

})

.catch(function(error){

alert(error.message);
console.log(error);

});

localStorage.setItem("studentCode",code);
localStorage.setItem("studentName",student.name);
localStorage.setItem("studentGrade",student.grade);

alert("✅ تم تسجيل الدخول");

window.location.href="index.html";

});

}

// نفس الجهاز

else if(student.deviceId === deviceId){

localStorage.setItem("studentCode",code);
localStorage.setItem("studentName",student.name);
localStorage.setItem("studentGrade",student.grade);

alert("✅ تم تسجيل الدخول");

window.location.href="index.html";

}

// جهاز آخر

else{

alert("❌ هذا الاشتراك مستخدم على جهاز آخر.");

}

.catch(function(error){

console.log(error);

alert(error.message);

});

}

</script>

</body>

</html>
