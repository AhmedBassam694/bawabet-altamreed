<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | بوابة التمريض</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<div class="logo">🩺</div>

<h2>بوابة التمريض</h2>

<p>سجل الدخول للمتابعة</p>

<div class="input-box">
<span class="icon">🔑</span>
<input type="text" id="code" placeholder="كود الاشتراك">
</div>

<div class="input-box">
<span class="icon">🔒</span>
<input type="password" id="password" placeholder="كلمة المرور">
</div>

<button onclick="login()">
تسجيل الدخول
</button>

<br><br>

<p>
إذا لم يكن لديك كود اشتراك، تواصل مع إدارة بوابة التمريض.
</p>

<div class="footer">
© 2026 بوابة التمريض 
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script>
function login() {

const code = document.getElementById("code").value.trim();
const password = document.getElementById("password").value.trim();

if(code === "" || password === ""){
alert("من فضلك أدخل كود الاشتراك وكلمة المرور");
return;
}

db.collection("students").doc(code).get()

.then(function(doc){

if(!doc.exists){
alert("❌ كود الاشتراك غير صحيح");
return;
}

const student = doc.data();
alert(JSON.stringify(student));

if(student.password.trim() !== password.trim()){

alert("❌ كلمة المرور غير صحيحة");
return;

}

alert("✅ تم تسجيل الدخول");

localStorage.setItem("studentCode", code);

window.location.href = "index.html";

})

.catch(function(error){

console.log(error);

alert("❌ حدث خطأ: " + error.message);

});

}
</script>

</body>

</html>
